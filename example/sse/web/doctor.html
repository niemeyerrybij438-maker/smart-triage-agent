<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>&#21307;&#29983;&#24037;&#20316;&#21488; - &#26234;&#33021;&#23548;&#35786;</title><style>:root{--ink:#16231f;--muted:#65756f;--line:rgba(24,75,65,.13);--green:#075f58;--gold:#bd8b2f;--red:#b42318;--orange:#b65f16;--shadow:0 24px 70px rgba(24,45,39,.16)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 4%,rgba(189,139,47,.18),transparent 30%),radial-gradient(circle at 92% 10%,rgba(7,95,88,.16),transparent 34%),linear-gradient(135deg,#f7f4e9 0%,#edf4ef 52%,#eaf3ef 100%)}.page{width:min(1180px,calc(100% - 44px));margin:0 auto;padding:76px 0 46px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.18em;font-size:13px}h1{margin:8px 0 10px;font-size:clamp(32px,4vw,50px);line-height:1.05}.subtitle{margin:0;color:var(--muted);font-size:16px;max-width:740px;line-height:1.8}.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.doctor-user{padding:10px 14px;border-radius:999px;background:#e5f2ec;color:#044a45;font-size:13px;font-weight:900}.back,.logout{border:1px solid var(--line);background:rgba(255,253,248,.86);color:var(--green);padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:900;box-shadow:0 12px 28px rgba(23,35,31,.08);white-space:nowrap}.logout{cursor:pointer;font:inherit}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{background:rgba(255,253,248,.82);border:1px solid var(--line);border-radius:24px;padding:21px;box-shadow:0 18px 45px rgba(24,45,39,.10)}.stat strong{display:block;color:#044a45;font-size:34px}.stat span{color:var(--muted);font-size:13px;font-weight:800}.toolbar{display:grid;grid-template-columns:1fr 150px 150px 130px;gap:10px;margin:0 0 16px}.toolbar input,.toolbar select{border:1px solid var(--line);background:rgba(255,253,248,.9);border-radius:16px;padding:12px 14px;color:var(--ink);font-weight:700;outline:none}.layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);gap:18px;align-items:start}.panel{background:rgba(255,253,248,.88);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-title{font-weight:900;font-size:18px}.refresh,.action{border:0;background:var(--green);color:white;padding:10px 15px;border-radius:14px;font-weight:900;cursor:pointer}.action.secondary{background:#e5f2ec;color:#044a45}.record-list{max-height:650px;overflow:auto;padding:12px}.record{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:20px;padding:15px;cursor:pointer;display:grid;gap:10px;color:inherit}.record:hover,.record.active{background:#f4f0e4;border-color:rgba(189,139,47,.30)}.record.processed{opacity:.64}.record-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.symptom{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{color:var(--muted);font-size:12px;flex:none}.meta{display:flex;flex-wrap:wrap;gap:8px}.tag{display:inline-flex;align-items:center;min-height:24px;padding:4px 9px;border-radius:999px;background:#e5f2ec;color:#044a45;font-size:12px;font-weight:900}.tag.risk-high{background:#ffe8e5;color:var(--red)}.tag.risk-mid{background:#fff0da;color:var(--orange)}.tag.status-processed{background:#eef0ea;color:#66706a}.tag.status-viewed{background:#e9f0ff;color:#315c9b}.detail{padding:24px;min-height:520px}.detail-empty{height:520px;display:grid;place-items:center;color:var(--muted);text-align:center;line-height:1.8}.detail h2{margin:0 0 12px;font-size:26px}.section{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.section-label{color:var(--gold);font-size:13px;font-weight:900;margin-bottom:8px;letter-spacing:.08em}.section-text{line-height:1.85;color:#2d3b35;white-space:pre-wrap}.doctor-note{width:100%;min-height:112px;margin-top:10px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fffdfa;color:var(--ink);font:inherit;line-height:1.65;resize:vertical;outline:none}.doctor-note:focus{border-color:rgba(7,95,88,.45);box-shadow:0 0 0 3px rgba(7,95,88,.08)}.note-hint{min-height:20px;margin-top:8px;color:var(--muted);font-size:12px}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.empty{padding:58px 20px;text-align:center;color:var(--muted);line-height:1.8}@media(max-width:900px){.topbar{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.page{width:min(100% - 24px,1180px)}}</style></head><body><main class="page"><header class="topbar"><div><div class="eyebrow">DOCTOR TRIAGE DESK</div><h1>&#21307;&#29983;&#23548;&#35786;&#24037;&#20316;&#21488;</h1><p class="subtitle">&#36825;&#37324;&#26159;&#21307;&#29983;&#35270;&#35282;&#65292;&#29992;&#20110;&#26597;&#30475;&#24739;&#32773;&#31471;&#25552;&#20132;&#30340;&#23548;&#35786;&#35760;&#24405;&#12289;&#39118;&#38505;&#31561;&#32423;&#12289;&#25512;&#33616;&#31185;&#23460;&#21644;&#23601;&#35786;&#20934;&#22791;&#20449;&#24687;&#12290;&#24739;&#32773;&#31471;&#19981;&#20250;&#23637;&#31034;&#21518;&#21488;&#20869;&#23481;&#12290;</p></div><div class="top-actions"><span class="doctor-user" id="doctorUser">&#21307;&#29983;</span><a class="back" href="/">&#36820;&#22238;&#24739;&#32773;&#31471;</a><button class="logout" id="logoutButton" type="button">&#36864;&#20986;&#30331;&#24405;</button></div></header><section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>&#20840;&#37096;&#35760;&#24405;</span></div><div class="stat"><strong id="highRiskCount">0</strong><span>&#20248;&#20808;&#20851;&#27880;</span></div><div class="stat"><strong id="departmentCount">0</strong><span>&#28041;&#21450;&#31185;&#23460;</span></div><div class="stat"><strong id="processedCount">0</strong><span>&#24050;&#22788;&#29702;</span></div></section><section class="toolbar"><input id="searchInput" placeholder="&#25628;&#32034;&#30151;&#29366; / &#31185;&#23460;"><select id="riskFilter"><option value="all">&#20840;&#37096;&#39118;&#38505;</option><option value="high">&#20248;&#20808;&#20851;&#27880;</option><option value="normal">&#24120;&#35268;&#35760;&#24405;</option></select><select id="departmentFilter"><option value="all">&#20840;&#37096;&#31185;&#23460;</option></select><select id="statusFilter"><option value="all">&#20840;&#37096;&#29366;&#24577;</option><option value="pending">&#24453;&#26597;&#30475;</option><option value="viewed">&#24050;&#26597;&#30475;</option><option value="processed">&#24050;&#22788;&#29702;</option></select></section><section class="layout"><div class="panel"><div class="panel-head"><div class="panel-title">&#24739;&#32773;&#23548;&#35786;&#35760;&#24405;</div><button class="refresh" id="refreshButton" type="button">&#21047;&#26032;</button></div><div class="record-list" id="recordList"><div class="empty">&#27491;&#22312;&#21152;&#36733;&#23548;&#35786;&#35760;&#24405;...</div></div></div><div class="panel detail" id="recordDetail"><div class="detail-empty">&#36873;&#25321;&#24038;&#20391;&#19968;&#26465;&#35760;&#24405;&#65292;&#26597;&#30475;&#23436;&#25972;&#23548;&#35786;&#24314;&#35758;&#12290;</div></div></section></main><script>const recordList=document.getElementById('recordList'),recordDetail=document.getElementById('recordDetail'),refreshButton=document.getElementById('refreshButton'),searchInput=document.getElementById('searchInput'),riskFilter=document.getElementById('riskFilter'),departmentFilter=document.getElementById('departmentFilter'),statusFilter=document.getElementById('statusFilter');let records=[],filteredRecords=[],selectedId=null;const text={loadingFail:'\u5bfc\u8bca\u8bb0\u5f55\u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u786e\u8ba4\u670d\u52a1\u548c\u6570\u636e\u5e93\u5df2\u542f\u52a8\u3002',noRecords:'\u6682\u65e0\u7b26\u5408\u6761\u4ef6\u7684\u5bfc\u8bca\u8bb0\u5f55\u3002',noDetail:'\u6682\u65e0\u8bb0\u5f55\u53ef\u67e5\u770b\u3002',pending:'\u5f85\u67e5\u770b',viewed:'\u5df2\u67e5\u770b',processed:'\u5df2\u5904\u7406',normal:'\u5e38\u89c4\u8bc4\u4f30',patient:'\u60a3\u8005\u63cf\u8ff0',reason:'\u63a8\u8350\u7406\u7531',alternatives:'\u5907\u9009\u79d1\u5ba4',preparation:'\u5c31\u8bca\u51c6\u5907',warning:'\u98ce\u9669\u63d0\u9192',noReason:'\u6682\u65e0\u8be6\u7ec6\u7406\u7531',noAlternatives:'\u6682\u65e0\u5907\u9009\u79d1\u5ba4',noPreparation:'\u6682\u65e0\u51c6\u5907\u5efa\u8bae',defaultWarning:'\u5982\u75c7\u72b6\u660e\u663e\u52a0\u91cd\uff0c\u8bf7\u53ca\u65f6\u7ebf\u4e0b\u5c31\u533b\u3002'};function escapeHTML(v){const d=document.createElement('div');return d.textContent=v||'',d.innerHTML}function formatTime(v){if(!v)return'-';const d=new Date(v);return Number.isNaN(d.getTime())?'-':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function recordStatus(r){return r.status||'pending'}function statusText(r){return text[recordStatus(r)]||text.pending}function isHighRisk(r){const v=(r.riskText||'')+(r.riskLevel||'')+(r.warning||'');return /\u6025\u8bca|\u5c3d\u5feb|\u9ad8|P1|P2|\u80f8\u75db|\u547c\u5438\u56f0\u96be|\u610f\u8bc6/.test(v)}function riskClass(r){return isHighRisk(r)?'risk-high':/\u89c2\u5bdf|\u666e\u901a|P3|P4|\u95e8\u8bca/.test((r.riskText||'')+(r.riskLevel||''))?'risk-mid':''}function isNoiseRecord(r){const s=(r.symptom||'').replace(/[\u3001\u3002\uff0c\uff01\uff1f!?.\s]/g,'');return /^(\u8c22\u8c22|\u597d\u7684\u8c22\u8c22|\u597d\u8c22\u8c22|\u8c22\u8c22\u4f60|\u597d\u7684|\u6ca1\u6709|\u6ca1\u6709\u4e86|\u6ca1\u4e86|\u77e5\u9053\u4e86)$/.test(s)}function renderStats(){const d=new Set(filteredRecords.map(r=>r.department).filter(Boolean));document.getElementById('totalCount').textContent=filteredRecords.length;document.getElementById('highRiskCount').textContent=filteredRecords.filter(isHighRisk).length;document.getElementById('departmentCount').textContent=d.size;document.getElementById('processedCount').textContent=filteredRecords.filter(r=>recordStatus(r)==='processed').length}function renderDepartmentOptions(){const current=departmentFilter.value;const deps=[...new Set(records.map(r=>r.department).filter(Boolean))];departmentFilter.innerHTML='<option value="all">\u5168\u90e8\u79d1\u5ba4</option>'+deps.map(dep=>'<option value="'+escapeHTML(dep)+'">'+escapeHTML(dep)+'</option>').join('');departmentFilter.value=deps.includes(current)?current:'all'}function applyFilters(){const keyword=searchInput.value.trim().toLowerCase();filteredRecords=records.filter(r=>{if(isNoiseRecord(r))return false;if(riskFilter.value==='high'&&!isHighRisk(r))return false;if(riskFilter.value==='normal'&&isHighRisk(r))return false;if(departmentFilter.value!=='all'&&r.department!==departmentFilter.value)return false;if(statusFilter.value!=='all'&&recordStatus(r)!==statusFilter.value)return false;if(keyword){const haystack=((r.symptom||'')+(r.department||'')+(r.riskText||'')).toLowerCase();if(!haystack.includes(keyword))return false}return true});if(!filteredRecords.some(r=>r.id===selectedId))selectedId=filteredRecords[0]?filteredRecords[0].id:null;renderStats();renderList();renderDetail()}function renderList(){if(!filteredRecords.length){recordList.innerHTML='<div class="empty">'+text.noRecords+'</div>';recordDetail.innerHTML='<div class="detail-empty">'+text.noDetail+'</div>';return}recordList.innerHTML=filteredRecords.map(r=>'<button class="record '+(r.id===selectedId?'active ':'')+(recordStatus(r)==='processed'?'processed':'')+'" type="button" data-id="'+r.id+'"><div class="record-top"><div class="symptom">'+escapeHTML(r.symptom)+'</div><div class="time">'+formatTime(r.createdAt)+'</div></div><div class="meta"><span class="tag">'+escapeHTML(r.department||'\u5f85\u5206\u8bca')+'</span><span class="tag '+riskClass(r)+'">'+escapeHTML(r.riskText||r.riskLevel||text.normal)+'</span><span class="tag status-'+recordStatus(r)+'">'+statusText(r)+'</span></div></button>').join('');recordList.querySelectorAll('.record').forEach(b=>b.addEventListener('click',()=>{selectedId=Number(b.dataset.id);if((records.find(r=>r.id===selectedId)||{}).status==='pending')updateStatus(selectedId,'viewed',false);renderList();renderDetail()}))}function detailRow(l,v){return'<div class="section"><div class="section-label">'+l+'</div><div class="section-text">'+escapeHTML(v)+'</div></div>'}function renderDetail(){const r=filteredRecords.find(i=>i.id===selectedId);if(!r)return;recordDetail.innerHTML='<h2>'+escapeHTML(r.department||'\u5f85\u5206\u8bca')+'</h2><div class="meta"><span class="tag '+riskClass(r)+'">'+escapeHTML(r.riskText||r.riskLevel||text.normal)+'</span><span class="tag status-'+recordStatus(r)+'">'+statusText(r)+'</span><span class="tag">'+formatTime(r.createdAt)+'</span></div>'+detailRow(text.patient,r.symptom)+detailRow(text.reason,r.reason||text.noReason)+detailRow(text.alternatives,r.alternatives||text.noAlternatives)+detailRow(text.preparation,r.preparation||text.noPreparation)+detailRow(text.warning,r.warning||text.defaultWarning)+(r.handledBy?detailRow('\u5904\u7406\u4fe1\u606f','\u64cd\u4f5c\u533b\u751f\uff1a'+r.handledBy+(r.processedAt?'\uff1b\u5904\u7406\u65f6\u95f4\uff1a'+formatTime(r.processedAt):r.viewedAt?'\uff1b\u67e5\u770b\u65f6\u95f4\uff1a'+formatTime(r.viewedAt):'')):'')+'<div class="section"><div class="section-label">\u533b\u751f\u5904\u7406\u5907\u6ce8</div><textarea id="doctorNote" class="doctor-note" placeholder="\u8bb0\u5f55\u5904\u7406\u610f\u89c1\u3001\u56de\u8bbf\u5b89\u6392\u6216\u9700\u8981\u8865\u5145\u7684\u68c0\u67e5">'+escapeHTML(r.doctorNote||'')+'</textarea><div id="noteHint" class="note-hint"></div></div><div class="detail-actions"><button class="action secondary" onclick="updateStatus('+r.id+',\'viewed\',true)">\u6807\u8bb0\u5df2\u67e5\u770b</button><button class="action" onclick="saveDoctorNote('+r.id+')">\u4fdd\u5b58\u5907\u6ce8</button><button class="action" onclick="updateStatus('+r.id+',\'processed\',true)">\u6807\u8bb0\u5df2\u5904\u7406</button><button class="action secondary" onclick="updateStatus('+r.id+',\'pending\',true)">\u9000\u56de\u5f85\u67e5\u770b</button></div>'}async function persistRecordUpdate(id,status,doctorNote){const response=await fetch('/api/triage-records/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:status||'',doctorNote:doctorNote||''})});if(!response.ok)throw new Error('update failed');return response.json()}async function updateStatus(id,status,rerender){const target=records.find(r=>r.id===id);const doctorNote=document.getElementById('doctorNote');const note=doctorNote?doctorNote.value:(target&&target.doctorNote)||'';if(target){target.status=status;target.doctorNote=note}if(rerender)applyFilters();try{await persistRecordUpdate(id,status,note)}catch(e){}}async function saveDoctorNote(id){const target=records.find(r=>r.id===id);const input=document.getElementById('doctorNote');const hint=document.getElementById('noteHint');if(!input)return;const note=input.value.trim();if(hint)hint.textContent='\u4fdd\u5b58\u4e2d...';try{await persistRecordUpdate(id,target?target.status:'',note);if(target)target.doctorNote=note;if(hint)hint.textContent='\u5df2\u4fdd\u5b58'}catch(e){if(hint)hint.textContent='\u4fdd\u5b58\u5931\u8d25\uff0c\u8bf7\u91cd\u8bd5'}}async function loadRecords(){refreshButton.disabled=true;refreshButton.textContent='\u5237\u65b0\u4e2d';try{const res=await fetch('/api/triage-records',{cache:'no-store'});if(!res.ok)throw new Error('records api failed');records=(await res.json()).filter(r=>!isNoiseRecord(r));renderDepartmentOptions();applyFilters();refreshButton.textContent='\u5df2\u5237\u65b0';setTimeout(()=>{refreshButton.textContent='\u5237\u65b0'},900)}catch(e){recordList.innerHTML='<div class="empty">'+text.loadingFail+'</div>';refreshButton.textContent='\u91cd\u8bd5'}finally{refreshButton.disabled=false}}[searchInput,riskFilter,departmentFilter,statusFilter].forEach(el=>el.addEventListener('input',applyFilters));refreshButton.addEventListener('click',loadRecords);const logoutButton=document.getElementById('logoutButton'),doctorUser=document.getElementById('doctorUser');fetch('/api/doctor/me').then(r=>{if(!r.ok)throw new Error('unauthorized');return r.json()}).then(data=>{if(doctorUser)doctorUser.textContent=data.displayName||data.username||'\u533b\u751f'}).catch(()=>location.href='/doctor/login');if(logoutButton)logoutButton.addEventListener('click',async()=>{await fetch('/api/doctor/logout',{method:'POST'}).catch(()=>{});location.href='/doctor/login'});loadRecords();setInterval(()=>{if(document.visibilityState==='visible')loadRecords()},10000);</script></body></html>
