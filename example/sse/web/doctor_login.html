<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医生登录 · 智医导诊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial;background:#f3f7fc;color:#17233a}.top{height:64px;background:#fff;border-bottom:1px solid #e3e9f1;display:flex;align-items:center;padding:0 32px}.brand{font-size:20px;font-weight:800;color:#1262ce}.brand b{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:#1769e0;color:#fff;margin-right:10px}.page{min-height:calc(100vh - 64px);display:grid;grid-template-columns:1fr 1fr}.visual{background:linear-gradient(145deg,#124fae,#1c75de);color:#fff;padding:13vh 11%;position:relative;overflow:hidden}.visual h1{font-size:38px;margin:25px 0 14px}.visual p{font-size:17px;line-height:1.9;color:#dfedff}.flow{margin-top:42px;display:grid;gap:14px}.flow div{border-left:3px solid #fff;padding:10px 16px;background:#ffffff12;border-radius:0 8px 8px 0}.login{display:grid;place-items:center}.box{width:430px;background:#fff;padding:38px;border:1px solid #e2e8f1;border-radius:14px;box-shadow:0 18px 55px #31578318}.box h2{font-size:28px;margin:0 0 8px}.muted{color:#748198}label{display:block;font-weight:700;margin:21px 0 8px}input{width:100%;height:50px;border:1px solid #d8e1ed;border-radius:8px;padding:0 14px;font-size:15px}button{width:100%;height:50px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-weight:800;font-size:16px;margin-top:25px;cursor:pointer}.error{min-height:22px;color:#d93c47;margin-top:10px}.security{margin-top:24px;padding-top:20px;border-top:1px solid #e6ebf2;color:#7a8799;font-size:12px;text-align:center}@media(max-width:850px){.page{grid-template-columns:1fr}.visual{display:none}.login{padding:25px}.box{width:100%}}</style></head><body><header class="top"><div class="brand"><b>✚</b>智医导诊医生工作台</div></header><main class="page"><section class="visual"><div style="font-size:50px">⚕</div><h1>医生协同诊断中心</h1><p>集中查看 AI 分诊结果、风险报告与患者队列，完成医生复核、处置意见和急诊绿色通道协同。</p><div class="flow"><div><b>患者队列</b><br>按风险等级和等待时间排序</div><div><b>多 Agent 结论</b><br>呈现症状提取、风险判断和科室建议</div><div><b>医生最终复核</b><br>保存备注并更新患者处理状态</div></div></section><section class="login"><form class="box" id="form"><h2>医生登录</h2><p class="muted">请输入医院后台分配的医生账号</p><label>医生账号</label><input id="username" autocomplete="username" placeholder="请输入用户名" required autofocus><label>登录密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button id="submit">登录医生工作台</button><div id="error" class="error"></div><div class="security">账号由管理员统一创建和启停，请勿将凭据提供给他人。</div></form></section></main><script>form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='正在验证…';error.textContent='';try{const r=await fetch('/api/doctor/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});if(!r.ok)throw Error();location.href='/doctor'}catch{error.textContent='医生账号或密码错误'}finally{submit.disabled=false;submit.textContent='登录医生工作台'}}</script></body></html>
