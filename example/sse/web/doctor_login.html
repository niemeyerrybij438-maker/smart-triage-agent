<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>&#21307;&#29983;&#30331;&#24405; - &#26234;&#33021;&#23548;&#35786;</title><style>:root{--green:#075f58;--ink:#17231f;--muted:#68766f;--line:rgba(24,75,65,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,rgba(189,139,47,.17),transparent 32%),radial-gradient(circle at 86% 12%,rgba(7,95,88,.16),transparent 34%),#eef4ef}.card{width:min(440px,100%);padding:34px;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:28px;box-shadow:0 28px 80px rgba(22,42,36,.16)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;color:#b37e22}h1{margin:10px 0 8px;font-size:32px}.sub{margin:0 0 26px;color:var(--muted);line-height:1.7}.field{display:grid;gap:8px;margin-top:16px}.field label{font-size:13px;font-weight:900}.field input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;outline:none}.field input:focus{border-color:rgba(7,95,88,.5);box-shadow:0 0 0 3px rgba(7,95,88,.09)}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:14px;background:var(--green);color:white;font-size:16px;font-weight:900;cursor:pointer}.error{min-height:22px;margin-top:12px;color:#b42318;font-size:13px}.back{display:block;margin-top:16px;text-align:center;color:var(--green);text-decoration:none;font-weight:800}</style></head><body><main class="card"><div class="eyebrow">DOCTOR ACCESS</div><h1>&#21307;&#29983;&#24037;&#20316;&#21488;&#30331;&#24405;</h1><p class="sub">&#23548;&#35786;&#35760;&#24405;&#21253;&#21547;&#24739;&#32773;&#20581;&#24247;&#20449;&#24687;&#65292;&#35831;&#20351;&#29992;&#21307;&#29983;&#36134;&#21495;&#30331;&#24405;&#21518;&#26597;&#30475;&#12290;</p><form id="loginForm"><div class="field"><label for="username">&#36134;&#21495;</label><input id="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">&#23494;&#30721;</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submitButton" type="submit">&#30331;&#24405;&#24037;&#20316;&#21488;</button><div class="error" id="error"></div></form><a class="back" href="/">&#36820;&#22238;&#24739;&#32773;&#31471;</a></main><script>const form=document.getElementById('loginForm'),button=document.getElementById('submitButton'),error=document.getElementById('error');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;button.textContent='\u767b\u5f55\u4e2d...';error.textContent='';try{const response=await fetch('/api/doctor/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});if(!response.ok)throw new Error('\u8d26\u53f7\u6216\u5bc6\u7801\u9519\u8bef');location.href='/doctor'}catch(e){error.textContent=e.message||'\u767b\u5f55\u5931\u8d25'}finally{button.disabled=false;button.textContent='\u767b\u5f55\u5de5\u4f5c\u53f0'}});</script></body></html>
