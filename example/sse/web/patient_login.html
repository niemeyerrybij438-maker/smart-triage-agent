<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>患者登录 · 智医导诊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial;color:#17233a;background:#f3f7fc}.top{height:64px;background:#fff;display:flex;align-items:center;padding:0 32px;border-bottom:1px solid #e4eaf2}.brand{font-size:20px;font-weight:800;color:#1262ce}.brand b{display:inline-grid;place-items:center;width:36px;height:36px;background:#1769e0;color:#fff;border-radius:9px;margin-right:10px}.page{min-height:calc(100vh - 64px);display:grid;grid-template-columns:1.05fr .95fr}.hero{background:linear-gradient(145deg,#0c5bc9,#2383ed);color:#fff;padding:11vh 10%;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:460px;height:460px;border:1px solid #ffffff28;border-radius:50%;right:-200px;bottom:-210px}.hero h1{font-size:38px;margin:28px 0 16px}.hero p{max-width:550px;font-size:17px;line-height:1.9;color:#e7f2ff}.features{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px}.feature{padding:18px;background:#ffffff13;border:1px solid #ffffff24;border-radius:10px}.login{display:grid;place-items:center;padding:40px}.box{width:min(440px,100%);background:#fff;padding:36px;border:1px solid #e2e8f1;border-radius:14px;box-shadow:0 18px 55px #31578318}.box h2{font-size:28px;margin:0 0 8px}.muted{color:#75829a}.tabs{display:flex;border-bottom:1px solid #e5ebf3;margin:26px 0}.tab{flex:1;padding:12px;text-align:center;color:#1769e0;font-weight:700;border-bottom:3px solid #1769e0}label{display:block;font-weight:700;margin:15px 0 7px}input{width:100%;height:48px;border:1px solid #d9e2ef;border-radius:8px;padding:0 13px;font-size:15px}.code{display:flex;gap:9px}.code input{flex:1}.secondary,.primary{height:48px;border-radius:8px;font-weight:700;cursor:pointer}.secondary{border:1px solid #bcd0ea;background:#fff;color:#1769e0;padding:0 14px}.primary{width:100%;border:0;background:#1769e0;color:#fff;margin-top:22px;font-size:16px}.agree{font-size:12px;color:#77849a;margin-top:15px}.hint{min-height:22px;color:#df3d49;font-size:13px;margin-top:9px}@media(max-width:850px){.page{grid-template-columns:1fr}.hero{display:none}}</style></head><body><header class="top"><div class="brand"><b>✚</b>智医导诊</div></header><main class="page"><section class="hero"><div style="font-size:50px">✚</div><h1>为您匹配更合适的就医路径</h1><p>通过多 Agent 协同分析症状、风险信号和就诊需求，生成风险评估、科室建议与就诊准备清单。</p><div class="features"><div class="feature"><b>智能风险分层</b><div>优先识别急危重危险信号</div></div><div class="feature"><b>科室精准推荐</b><div>结合症状与就诊路径综合判断</div></div><div class="feature"><b>报告持续归档</b><div>登录后保存个人历史导诊记录</div></div><div class="feature"><b>隐私安全保护</b><div>验证码登录与独立患者会话</div></div></div></section><section class="login"><div class="box"><h2>患者登录</h2><p class="muted">验证手机号后进入智能导诊服务</p><div class="tabs"><div class="tab">本地验证码登录</div></div><label>手机号码</label><input id="phone" maxlength="11" placeholder="请输入 11 位手机号"><label>随机验证码</label><div class="code"><input id="code" maxlength="6" placeholder="请输入验证码"><button id="send" class="secondary">生成验证码</button></div><div id="hint" class="hint"></div><button id="login" class="primary">登录并进入导诊</button><div class="agree">登录即表示您同意《用户服务协议》和《隐私保护政策》</div></div></section></main><script>async function api(url,opt){const response=await fetch(url,opt);if(!response.ok)throw Error(await response.text());return response.json()}send.onclick=async()=>{hint.textContent='\u6b63\u5728\u751f\u6210...';hint.style.color='#1769e0';send.disabled=true;try{const result=await api('/api/patient/sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value.trim()})});hint.textContent=result.debugCode?'\u9a8c\u8bc1\u7801\uff1a'+result.debugCode+'\uff08\u5df2\u81ea\u52a8\u586b\u5165\uff09':'\u9a8c\u8bc1\u7801\u5df2\u751f\u6210';if(result.debugCode)code.value=result.debugCode}catch(error){hint.style.color='#df3d49';hint.textContent='\u9a8c\u8bc1\u7801\u751f\u6210\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u624b\u673a\u53f7'}finally{send.disabled=false}};login.onclick=async()=>{hint.textContent='\u6b63\u5728\u767b\u5f55...';try{await api('/api/patient/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value.trim(),code:code.value.trim()})});location.href='/'}catch(error){hint.style.color='#df3d49';hint.textContent='\u767b\u5f55\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u624b\u673a\u53f7\u548c\u9a8c\u8bc1\u7801'}}</script></body></html>
